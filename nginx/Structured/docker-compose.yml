version: "3"

services:
  proxy:
    image: nginx
    depends_on:
      - ui
    volumes:
      - type: bind
        source: ./proxy/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    ports:
      - 8000:8000
    restart: unless-stopped

  ui:
    image: nginx
    volumes:
      - type: bind
        source: ./ui/cinema/
        target: /usr/share/nginx/html/cinema/
        read_only: true
      - type: bind
        source: ./ui/demo/
        target: /usr/share/nginx/html/demo/
        read_only: true
      - type: bind
        source: ./ui/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    restart: unless-stopped
