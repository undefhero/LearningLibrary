server {
    listen 8000;
    # server_name artlair.tonxpay.app democinema.tonxpay.app cinema.tonxpay.app;

    # ssl_certificate     www.tonxpay.app.chained.crt;
    # ssl_certificate_key www.tonxpay.app.key;
    # ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    root /proxy;
    limit_req zone=mylimit burst=70 nodelay;

    location / {
        proxy_pass http://ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    location /demo {
        proxy_pass http://ui/demo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    location = /demo/ {
      return 301 /demo;
    }

    # location = /api {
    #   return 301 /api/;
    # }

    # location /api/ {
    #   proxy_pass http://api:5050/;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location /test {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}