apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lab153deploy
  name: lab153deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab153deploy
  strategy: {}
  template:
    metadata:
      labels:
        app: lab153deploy
    spec:
      containers:
        - image: nginx
          name: nginx
          resources: {}
          command:
            - sh
            - -c
            - sleep 30 && nginx -g 'daemon off;'
status: {}
